<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tech Desk Dashboard</title>
    <style>
      /* Kill the browser's default 8px body margin and paint the page itself
         dark. Lives here rather than in a component so it also covers the
         sign-in gate, which renders before any app styles exist. */
      html,
      body,
      #root {
        margin: 0;
        padding: 0;
        min-height: 100%;
        background: #0b0e11;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
